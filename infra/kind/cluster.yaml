# yaml-language-server: $schema=https://kind.sigs.k8s.io/schema/kind.x-k8s.io_v1alpha4.json
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: noti-ninja-dev

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

  - role: worker
  - role: worker

networking:
  ipFamily: ipv4
